# =============================================================================
# .gitea/workflows/release.yml — TodoList
#
# Conventional-commits-driven SemVer + Gitea Release pipeline.
#
# ASSUMPTIONS YOU MAY NEED TO EDIT:
#   - `runs-on: ubuntu-latest` below. If your self-hosted runner uses a
#     different label (e.g. `self-hosted`, `homelab-linux`), change BOTH jobs.
#   - The `RELEASE_TOKEN` secret must exist (PAT with repo:write scope on
#     this repo). The auto-provisioned GITEA_TOKEN often cannot push tags.
#     Create at: https://gitea.lan/user/settings/applications  -> "Generate New Token"
#     Then add via Repo Settings -> Actions -> Secrets as RELEASE_TOKEN.
#
# CONVENTIONAL COMMIT BUMP RULES (applied to commits since the last v* tag):
#   - BREAKING CHANGE / footer `BREAKING CHANGE:` / `feat!:` / `fix!:` -> MAJOR
#   - feat:                                                            -> MINOR
#   - fix:, perf:, refactor:                                           -> PATCH
#   - chore:, docs:, ci:, test:, style:, build:                        -> no bump
#   If no bumpable commits exist since the last tag, the run exits early.
# =============================================================================
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute version and build, but do not tag or publish a release"
        type: boolean
        default: false
      version_override:
        description: "Force this exact version (e.g. 1.2.3). Leave blank for auto-calculated."
        type: string
        default: ""

permissions:
  contents: write   # needed to create tags + releases

env:
  DOTNET_VERSION: "8.0.x"
  APP_PROJECT: "src/TodoList.App/TodoList.App.csproj"
  APP_NAME: "todolist"
  RID: "win-x64"

jobs:
  # ---------------------------------------------------------------------------
  # 1. version — derive next semver from tags + conventional commits
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      previous_tag: ${{ steps.semver.outputs.previous_tag }}
      should_release: ${{ steps.semver.outputs.should_release }}
      changelog: ${{ steps.semver.outputs.changelog }}
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next semantic version
        id: semver
        shell: bash
        run: |
          set -euo pipefail

          OVERRIDE="${{ github.event.inputs.version_override }}"

          # Only look at v<major>.<minor>.<patch> tags. This deliberately
          # excludes garbage tags like the existing `test` tag.
          PREV_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          echo "previous_tag=${PREV_TAG:-<none>}" >> "$GITHUB_OUTPUT"

          if [ -n "$OVERRIDE" ]; then
            NEXT="$OVERRIDE"
            BUMP="override"
            COMMITS=$(git log --pretty=format:'%s' || true)
          else
            if [ -z "$PREV_TAG" ]; then
              # No prior semver tag — seed from 0.0.0 so the first feat bumps to 0.1.0.
              PREV_VERSION="0.0.0"
              COMMITS=$(git log --pretty=format:'%s%n%b%n--END--' || true)
            else
              PREV_VERSION="${PREV_TAG#v}"
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:'%s%n%b%n--END--' || true)
            fi

            MAJOR=$(echo "$PREV_VERSION" | cut -d. -f1)
            MINOR=$(echo "$PREV_VERSION" | cut -d. -f2)
            PATCH=$(echo "$PREV_VERSION" | cut -d. -f3)

            BUMP="none"
            # Breaking: subject contains `!:` after type, or any line starts with BREAKING CHANGE
            if echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:' \
               || echo "$COMMITS" | grep -qE '^BREAKING CHANGE:'; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -qE '^(fix|perf|refactor)(\([^)]+\))?:'; then
              BUMP="patch"
            fi

            case "$BUMP" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
              none)  : ;;
            esac
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Decide whether to actually cut a release
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$OVERRIDE" ]; then
            SHOULD_RELEASE="true"
          elif [ "$BUMP" = "none" ]; then
            SHOULD_RELEASE="false"
          elif git rev-parse "v${NEXT}" >/dev/null 2>&1; then
            echo "::warning::Tag v${NEXT} already exists — skipping release."
            SHOULD_RELEASE="false"
          else
            SHOULD_RELEASE="true"
          fi

          # Build a changelog grouped by type
          {
            echo "## What's changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..HEAD"
            else
              RANGE="HEAD"
            fi

            emit_group() {
              local heading="$1" pattern="$2"
              local lines
              lines=$(git log $RANGE --pretty=format:'- %s (%h)' --no-merges | grep -E "$pattern" || true)
              if [ -n "$lines" ]; then
                echo "### $heading"
                echo "$lines"
                echo ""
              fi
            }
            emit_group "Breaking changes" '^- [a-zA-Z]+(\([^)]+\))?!:'
            emit_group "Features"         '^- feat(\([^)]+\))?:'
            emit_group "Fixes"            '^- fix(\([^)]+\))?:'
            emit_group "Performance"      '^- perf(\([^)]+\))?:'
            emit_group "Refactoring"      '^- refactor(\([^)]+\))?:'
            emit_group "Docs"             '^- docs(\([^)]+\))?:'
            emit_group "Other"            '^- (chore|ci|test|style|build)(\([^)]+\))?:'

            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full changelog**: ${PREV_TAG}...v${NEXT}"
            fi
          } > /tmp/changelog.md

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          # Multiline output
          {
            echo "changelog<<__EOF_CHANGELOG__"
            cat /tmp/changelog.md
            echo "__EOF_CHANGELOG__"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== Version calculation ==="
          echo "Previous tag:  ${PREV_TAG:-<none>}"
          echo "Bump:          $BUMP"
          echo "Next version:  $NEXT"
          echo "Should release: $SHOULD_RELEASE"
          echo "=========================="

  # ---------------------------------------------------------------------------
  # 2. build — publish self-contained single-file EXE, package as ZIP
  # ---------------------------------------------------------------------------
  build:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TodoList.slnx

      # Mirrors the Makefile's `publish-single` target exactly.
      - name: Publish self-contained single-file (${{ env.RID }})
        run: |
          dotnet publish "${{ env.APP_PROJECT }}" \
            -c Release \
            -r ${{ env.RID }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version=${VERSION} \
            -p:AssemblyVersion=${VERSION}.0 \
            -p:FileVersion=${VERSION}.0 \
            -p:InformationalVersion=${VERSION} \
            -o "publish/${{ env.RID }}"

      - name: Create ZIP archive
        run: |
          mkdir -p artifacts
          cd "publish/${{ env.RID }}"
          zip -r "../../artifacts/${{ env.APP_NAME }}-${VERSION}-${{ env.RID }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: release-artifacts
          path: artifacts/*.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. release — create tag + Gitea release, attach ZIP
  # ---------------------------------------------------------------------------
  release:
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANGELOG: ${{ needs.version.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-artifacts
          path: artifacts

      - name: Create + push annotated tag
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@users.noreply.gitea.lan"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      # Calls Gitea's REST API directly — works on any Gitea version, no third-party action needed.
      - name: Create Gitea release + upload assets
        env:
          GITEA_SERVER: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          BODY=$(jq -Rs . <<<"$CHANGELOG")
          PAYLOAD=$(cat <<JSON
          {
            "tag_name": "v${VERSION}",
            "name": "v${VERSION}",
            "body": ${BODY},
            "draft": false,
            "prerelease": false
          }
          JSON
          )
          RELEASE_ID=$(curl -fsS \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "${GITEA_SERVER}/api/v1/repos/${OWNER}/${REPO}/releases" | jq -r '.id')

          echo "Created release id=${RELEASE_ID}"

          for asset in artifacts/*.zip; do
            echo "Uploading $asset..."
            curl -fsS \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${asset}" \
              "${GITEA_SERVER}/api/v1/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "$asset")"
          done
